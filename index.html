<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>📍 Share Lokasi Saya</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        /* Mengamankan tampilan agar tidak hancur jika style.css gagal dimuat */
        body { background-color: #f4f7f6; }
        .card { border: none; box-shadow: 0 4px 15px rgba(0,0,0,0.1); border-radius: 15px; padding: 20px; }
        .btn-primary-custom { background-color: #4a6ee0; color: white; border-radius: 8px; }
        .status { padding: 10px; border-radius: 8px; margin-bottom: 15px; font-weight: bold; }
        .status.success { background-color: #d4edda; color: #155724; }
        .status.error { background-color: #f8d7da; color: #721c24; }
        .status.warning { background-color: #fff3cd; color: #856404; }
        .share-link span { background: #e9ecef; padding: 10px; border-radius: 6px; display: block; word-break: break-all; font-family: monospace; }
        /* MEMAKSA PETA MEMILIKI TINGGI AGAR TIDAK CRASH */
        #map { height: 350px; width: 100%; border-radius: 10px; z-index: 1; }
    </style>
</head>
<body>
    <div class="container py-4">
        <div class="row justify-content-center">
            <div class="col-lg-8 col-md-10">
                <div class="card text-center">
                    <h2 class="mb-3"><i class="fas fa-map-marker-alt text-danger me-2"></i>Share Lokasi Saya</h2>
                    <p class="text-muted mb-4">Bagikan lokasi real-time Anda dengan aman</p>
                    
                    <div class="mb-4 text-start">
                        <label class="form-label fw-bold"><i class="fas fa-hashtag me-2"></i>Session ID (Nama Grup/Unik)</label>
                        <input type="text" id="sessionId" class="form-control form-control-lg" placeholder="contoh: keluargaku" maxlength="20" value="keluargaku">
                    </div>
                    
                    <button id="getLocationBtn" class="btn btn-primary-custom btn-lg w-100 mb-4">
                        <i class="fas fa-location-arrow me-2"></i>Mulai Share Lokasi
                    </button>
                    
                    <div id="status" class="status d-none"></div>
                    <div id="map" class="mb-4"></div>
                    
                    <div id="shareSection" class="d-none">
                        <hr class="my-4">
                        <h4 class="mb-3"><i class="fas fa-share-alt me-2 text-primary"></i>Bagikan Link Ini</h4>
                        
                        <div id="qrCode" class="mb-3 d-flex justify-content-center"></div>
                        
                        <div class="share-link mb-3 text-start">
                            <span id="shareUrl" class="text-muted"></span>
                        </div>
                        <button id="copyBtn" class="btn btn-success w-100"><i class="fas fa-copy me-2"></i>Copy Link Sesi Ini</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

    <script>
        // Konfigurasi Firebase Anda
        const firebaseConfig = {
            apiKey: "AIzaSyDGTvoDJRKbDA9tslkAX3l6QNz0jFmOPXo",
            authDomain: "share-lokasi-app.firebaseapp.com",
            databaseURL: "https://share-lokasi-app-default-rtdb.asia-southeast1.firebasedatabase.app",
            projectId: "share-lokasi-app",
            storageBucket: "share-lokasi-app.firebasestorage.app",
            messagingSenderId: "639805343280",
            appId: "1:639805343280:web:13c6e1cc94d480002b8ff5"
        };
        
        if (!firebase.apps.length) {
            firebase.initializeApp(firebaseConfig);
        }
        const database = firebase.database();

        let map, marker, currentPos = null;
        let shareUrl = '';
        let intervalId;
        let isSharingLive = false; 

        const sessionIdInput = document.getElementById('sessionId');
        const getLocationBtn = document.getElementById('getLocationBtn');
        const statusDiv = document.getElementById('status');
        const shareSection = document.getElementById('shareSection');
        const shareUrlSpan = document.getElementById('shareUrl');
        const copyBtn = document.getElementById('copyBtn');
        const qrCodeDiv = document.getElementById('qrCode');

        // Mengamankan Inisialisasi Peta
        function initMap(lat = -6.2088, lng = 106.8456) { 
            try {
                map = L.map('map').setView([lat, lng], 15);
                L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);
                marker = L.marker([lat, lng]).addTo(map).bindPopup('<b>Lokasi Anda</b>').openPopup();
            } catch (e) {
                console.error("Gagal memuat peta:", e);
            }
        }

        function updateStatus(message, type = 'info') {
            statusDiv.textContent = message;
            statusDiv.className = `status ${type} d-block`;
            setTimeout(() => statusDiv.classList.add('d-none'), 5000); 
        }

        function getLocation() {
            if (!navigator.geolocation) {
                updateStatus('Geolocation tidak didukung browser ini.', 'error');
                return;
            }

            getLocationBtn.disabled = true;
            getLocationBtn.innerHTML = '<span class="spinner-border spinner-border-sm me-2"></span> Mencari sinyal...';

            if (intervalId) navigator.geolocation.clearWatch(intervalId);

            intervalId = navigator.geolocation.watchPosition(
                pos => {
                    try {
                        const { latitude: lat, longitude: lng, accuracy } = pos.coords;
                        currentPos = { lat, lng, accuracy, timestamp: Date.now() };
                        
                        updateMap();
                        saveToDatabase(); 
                        
                        // Eksekusi tampilan Link hanya SATU KALI agar tidak crash
                        if (!isSharingLive) {
                            isSharingLive = true; 
                            
                            updateStatus(`✅ Berhasil! Mengirim lokasi ke server...`, 'success');
                            updateShareUrl(); 
                            
                            getLocationBtn.disabled = false;
                            getLocationBtn.innerHTML = '<i class="fas fa-satellite-dish me-2"></i>Live: Sedang Berbagi';
                            getLocationBtn.classList.replace('btn-primary-custom', 'btn-success');
                        }
                    } catch (err) {
                        updateStatus('Error Sistem: ' + err.message, 'error');
                        getLocationBtn.disabled = false;
                        getLocationBtn.innerHTML = 'Coba Lagi';
                    }
                },
                err => {
                    if (!isSharingLive) {
                        updateStatus('Error GPS: ' + err.message, 'error');
                        getLocationBtn.disabled = false;
                        getLocationBtn.innerHTML = 'Coba Lagi';
                    }
                },
                { enableHighAccuracy: true, timeout: 15000, maximumAge: 0 }
            );
        }

        function updateMap() {
            if (!currentPos || !marker) return;
            marker.setLatLng([currentPos.lat, currentPos.lng]);
            map.setView([currentPos.lat, currentPos.lng], 16);
        }

        function saveToDatabase() {
            if (!currentPos || !sessionIdInput.value) return;
            database.ref('locations/' + sessionIdInput.value).set({
                position: currentPos,
                expires: Date.now() + 3600000 
            }).catch(e => console.error("Firebase Error:", e));
        }

        function updateShareUrl() {
            const session = sessionIdInput.value.trim();
            if (!session || !currentPos) return;
            
            let basePath = window.location.pathname;
            if (basePath.endsWith('index.html')) basePath = basePath.replace('index.html', '');
            if (!basePath.endsWith('/')) basePath += '/';
            
            shareUrl = `${window.location.origin}${basePath}viewer.html?session=${session}`;
            shareUrlSpan.textContent = shareUrl;
            
            // Menggunakan API Gambar untuk QR Code (DIJAMIN TIDAK BIKIN CRASH BROWSER)
            qrCodeDiv.innerHTML = `<img src="https://api.qrserver.com/v1/create-qr-code/?size=180x180&data=${encodeURIComponent(shareUrl)}" alt="QR Code" style="border-radius: 10px; border: 2px solid #ddd; padding: 5px;">`;
            
            shareSection.classList.remove('d-none');
        }

        getLocationBtn.addEventListener('click', getLocation);
        
        copyBtn.addEventListener('click', () => {
            navigator.clipboard.writeText(shareUrl).then(() => {
                const oriText = copyBtn.innerHTML;
                copyBtn.innerHTML = '<i class="fas fa-check me-2"></i>Link Tersalin!';
                setTimeout(() => copyBtn.innerHTML = oriText, 2000);
            });
        });
        
        sessionIdInput.addEventListener('input', () => {
            isSharingLive = false; 
            shareSection.classList.add('d-none');
            getLocationBtn.innerHTML = '<i class="fas fa-location-arrow me-2"></i>Update Sesi Baru';
            getLocationBtn.className = 'btn btn-primary-custom btn-lg w-100 mb-4';
        });

        initMap();
    </script>
</body>
</html>

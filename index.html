<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>📍 Live Satelit Group - Ahmad AS</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        body { background-color: #f0f2f5; color: #333; font-family: 'Segoe UI', Tahoma, sans-serif; }
        .card { background: #ffffff; border: none; box-shadow: 0 8px 30px rgba(0,0,0,0.1); border-radius: 20px; padding: 25px; }
        .form-control { background: #f8f9fa; border: 1px solid #ddd; color: #333; }
        
        /* Frame Foto Profil Lingkaran */
        .photo-preview-container { 
            width: 120px; height: 120px; border-radius: 50%; border: 4px solid #fff; 
            box-shadow: 0 4px 10px rgba(0,0,0,0.1); overflow: hidden; margin: 0 auto 15px auto; 
            background: #e9ecef; display: flex; align-items: center; justify-content: center; 
            cursor: pointer; position: relative;
        }
        #photoPreview { 
            width: 100%; height: 100%; object-fit: cover; 
            display: none; position: absolute; top: 0; left: 0;
        }
        .photo-preview-container i { font-size: 2.8rem; color: #adb5bd; }
        #fileInput { display: none; }

        .btn-primary-custom { background: linear-gradient(135deg, #4a6ee0, #3550a8); border: none; font-weight: 600; padding: 15px; color: white; border-radius: 12px; }
        #map { height: 280px; width: 100%; border-radius: 15px; margin-bottom: 20px; border: 1px solid #ddd; z-index: 1; }
        .status { padding: 12px; border-radius: 10px; margin-bottom: 20px; font-weight: 600; font-size: 0.9rem; }
        .status.success { background-color: #d1e7dd; color: #0f5132; }
    </small>
    </style>
</head>
<body>
    <div class="container py-4">
        <div class="row justify-content-center">
            <div class="col-lg-6 col-md-8">
                <div class="card text-center">
                    <h3 class="mb-4 text-primary"><i class="fas fa-map-marked-alt me-2"></i>Grup Tracking Satelit</h3>
                    
                    <input type="file" id="fileInput" accept="image/*">
                    <div class="photo-preview-container" onclick="document.getElementById('fileInput').click()">
                        <i class="fas fa-user-circle" id="cameraIcon"></i>
                        <img id="photoPreview" alt="Preview">
                    </div>
                    <p class="small text-muted mb-4">Klik lingkaran untuk pilih foto profil</p>

                    <div class="text-start mb-3">
                        <label class="form-label fw-bold small text-secondary">Nama Anda</label>
                        <input type="text" id="userName" class="form-control form-control-lg" placeholder="Contoh: Ahmad" maxlength="15">
                    </div>

                    <div class="text-start mb-4">
                        <label class="form-label fw-bold small text-secondary">Nama Grup (Session ID)</label>
                        <input type="text" id="sessionId" class="form-control form-control-lg" value="keluargaku">
                    </div>
                    
                    <button id="getLocationBtn" class="btn btn-primary-custom btn-lg w-100 mb-4 shadow-sm">
                        <i class="fas fa-location-arrow me-2"></i>Aktifkan Share Lokasi
                    </button>
                    
                    <div id="status" class="status d-none"></div>
                    <div id="map"></div>
                    
                    <div id="shareSection" class="d-none mt-4 text-center">
                        <hr>
                        <h6 class="text-secondary mb-3">Link Monitoring Grup</h6>
                        <div id="qrCode" class="mb-3 d-flex justify-content-center"></div>
                        <button id="copyBtn" class="btn btn-outline-primary w-100"><i class="fas fa-copy me-2"></i>Salin Link Grup</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

    <script>
        const IMGBB_API_KEY = "ca0b8160f91ffd10388a206d0289cf3c"; 

        const firebaseConfig = {
            apiKey: "AIzaSyDGTvoDJRKbDA9tslkAX3l6QNz0jFmOPXo",
            authDomain: "share-lokasi-app.firebaseapp.com",
            databaseURL: "https://share-lokasi-app-default-rtdb.asia-southeast1.firebasedatabase.app",
            projectId: "share-lokasi-app",
            storageBucket: "share-lokasi-app.firebasestorage.app",
            messagingSenderId: "639805343280",
            appId: "1:639805343280:web:13c6e1cc94d480002b8ff5"
        };
        
        firebase.initializeApp(firebaseConfig);
        const database = firebase.database();
        let map, marker, currentPos = null, isSharingLive = false, selectedFile, userPhotoURL = null;

        // Preview Logic Baru (Anti-Blank)
        document.getElementById('fileInput').addEventListener('change', function(e) {
            selectedFile = e.target.files[0];
            if (selectedFile) {
                const reader = new FileReader();
                reader.onload = function(event) {
                    const img = document.getElementById('photoPreview');
                    img.src = event.target.result;
                    img.style.display = 'block';
                    document.getElementById('cameraIcon').style.display = 'none';
                };
                reader.readAsDataURL(selectedFile);
            }
        });

        function initMap() {
            map = L.map('map', {attributionControl: false}).setView([-2.889, 122.178], 15);
            L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}').addTo(map);
            marker = L.marker([-2.889, 122.178]).addTo(map);
        }

        async function handleStartSharing() {
            const user = document.getElementById('userName').value.trim();
            const session = document.getElementById('sessionId').value.trim();
            if (!user || !session || !selectedFile) { alert("Nama, Grup, dan Foto wajib ada!"); return; }

            const btn = document.getElementById('getLocationBtn');
            btn.disabled = true;
            btn.innerHTML = '<span class="spinner-border spinner-border-sm me-2"></span>Mengirim Foto...';

            try {
                const formData = new FormData();
                formData.append("image", selectedFile);
                const response = await fetch(`https://api.imgbb.com/1/upload?key=${IMGBB_API_KEY}`, { method: "POST", body: formData });
                const result = await response.json();
                if (result.success) {
                    userPhotoURL = result.data.url;
                    btn.innerHTML = '<span class="spinner-border spinner-border-sm me-2"></span>Mencari GPS...';
                    startGpsTracking(user, session);
                } else { throw new Error("Gagal upload."); }
            } catch (error) { 
                alert("Upload Gagal: " + error.message); 
                btn.disabled = false; 
                btn.innerHTML = 'Coba Lagi'; 
            }
        }

        function startGpsTracking(user, session) {
            navigator.geolocation.watchPosition(
                pos => {
                    const { latitude: lat, longitude: lng, accuracy } = pos.coords;
                    currentPos = { lat, lng, accuracy, timestamp: Date.now() };
                    marker.setLatLng([lat, lng]);
                    map.setView([lat, lng], 16);
                    
                    database.ref(`locations/${session}/${user}`).set({ 
                        userName: user, 
                        photoURL: userPhotoURL, 
                        position: currentPos, 
                        expires: Date.now() + 3600000 
                    });

                    if (!isSharingLive) {
                        isSharingLive = true;
                        document.getElementById('status').textContent = "✅ Berbagi Lokasi Aktif!";
                        document.getElementById('status').className = "status success d-block";
                        showShareUI(session);
                        const btn = document.getElementById('getLocationBtn');
                        btn.innerHTML = '<i class="fas fa-check-circle me-2"></i>Live Berbagi Aktif';
                        btn.className = "btn btn-success btn-lg w-100 mb-4";
                    }
                },
                err => { alert("GPS Error: " + err.message); }, { enableHighAccuracy: true, timeout: 15000, maximumAge: 0 }
            );
        }

        function showShareUI(session) {
            let path = window.location.pathname.replace('index.html', '');
            if (!path.endsWith('/')) path += '/';
            const url = `${window.location.origin}${path}viewer.html?session=${session}`;
            document.getElementById('qrCode').innerHTML = `<img src="https://api.qrserver.com/v1/create-qr-code/?size=150x150&data=${encodeURIComponent(url)}" style="border: 1px solid #ddd; border-radius: 10px; padding: 5px; background: white;">`;
            document.getElementById('shareSection').classList.remove('d-none');
            window.finalUrl = url;
        }

        document.getElementById('copyBtn').addEventListener('click', () => {
            navigator.clipboard.writeText(window.finalUrl);
            alert("Link grup disalin!");
        });

        document.getElementById('getLocationBtn').addEventListener('click', handleStartSharing);
        initMap();
    </script>
</body>
</html>

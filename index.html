<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>📍 Live Group Tracking - Satelit</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        body { background-color: #1a1a1a; color: #fff; font-family: 'Segoe UI', Tahoma, sans-serif; }
        .card { background: #2d2d2d; border: none; box-shadow: 0 10px 30px rgba(0,0,0,0.5); border-radius: 20px; padding: 25px; color: #fff; }
        .form-control { background: #3d3d3d; border: 1px solid #444; color: #fff; }
        .form-control:focus { background: #444; color: #fff; border-color: #4a6ee0; box-shadow: none; }
        .btn-primary-custom { background: linear-gradient(135deg, #4a6ee0, #2e4cad); border: none; font-weight: 600; padding: 12px; }
        #map { height: 300px; width: 100%; border-radius: 15px; margin-bottom: 20px; border: 2px solid #444; }
        .share-link span { background: #3d3d3d; padding: 12px; border-radius: 10px; display: block; word-break: break-all; font-family: monospace; border: 1px dashed #666; margin-top: 10px; color: #00ff00; }
        .status { padding: 12px; border-radius: 10px; margin-bottom: 20px; font-weight: 600; }
        .status.success { background: #1b4332; color: #75ec9c; }
    </style>
</head>
<body>
    <div class="container py-5">
        <div class="row justify-content-center">
            <div class="col-lg-6 col-md-8">
                <div class="card text-center">
                    <h2 class="mb-4"><i class="fas fa-satellite text-info me-2"></i>Grup Tracking Satelit</h2>
                    
                    <div class="text-start mb-3">
                        <label class="form-label fw-bold small text-muted">Nama Anda</label>
                        <input type="text" id="userName" class="form-control form-control-lg" placeholder="Masukkan nama" maxlength="15">
                    </div>

                    <div class="text-start mb-4">
                        <label class="form-label fw-bold small text-muted">Session ID (Nama Grup)</label>
                        <input type="text" id="sessionId" class="form-control form-control-lg" placeholder="mis: keluargaku" maxlength="20" value="keluargaku">
                    </div>
                    
                    <button id="getLocationBtn" class="btn btn-primary-custom btn-lg w-100 mb-4">
                        <i class="fas fa-broadcast-tower me-2"></i>Mulai Berbagi Lokasi
                    </button>
                    
                    <div id="status" class="status d-none"></div>
                    <div id="map"></div>
                    
                    <div id="shareSection" class="d-none mt-4 text-start">
                        <h5 class="mb-3 text-center text-info">Link Monitoring Grup</h5>
                        <div id="qrCode" class="mb-3 d-flex justify-content-center"></div>
                        <div class="share-link mb-3">
                            <span id="shareUrl"></span>
                        </div>
                        <button id="copyBtn" class="btn btn-outline-info w-100"><i class="fas fa-copy me-2"></i>Salin Link Grup</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyDGTvoDJRKbDA9tslkAX3l6QNz0jFmOPXo",
            authDomain: "share-lokasi-app.firebaseapp.com",
            databaseURL: "https://share-lokasi-app-default-rtdb.asia-southeast1.firebasedatabase.app",
            projectId: "share-lokasi-app",
            storageBucket: "share-lokasi-app.firebasestorage.app",
            messagingSenderId: "639805343280",
            appId: "1:639805343280:web:13c6e1cc94d480002b8ff5"
        };
        
        firebase.initializeApp(firebaseConfig);
        const database = firebase.database();

        let map, marker, currentPos = null;
        let isSharingLive = false; 

        const userNameInput = document.getElementById('userName');
        const sessionIdInput = document.getElementById('sessionId');
        const getLocationBtn = document.getElementById('getLocationBtn');
        const statusDiv = document.getElementById('status');

        function initMap() {
            map = L.map('map').setView([-6.2088, 106.8456], 15);
            // MENGGUNAKAN MODE SATELIT REAL
            L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{y}/{x}/{x}', {
                attribution: 'Tiles &copy; Esri &mdash; Source: Esri, i-cubed, USDA, USGS, AEX, GeoEye, Getmapping, Aerogrid, IGN, IGP, UPR-EBP, and the GIS User Community'
            }).addTo(map);
            marker = L.marker([-6.2088, 106.8456]).addTo(map);
        }

        function startSharing() {
            const user = userNameInput.value.trim();
            if (!user) { alert("Isi nama dulu!"); return; }

            getLocationBtn.disabled = true;
            getLocationBtn.innerHTML = '<i class="fas fa-spinner fa-spin me-2"></i>Menghubungkan...';

            navigator.geolocation.watchPosition(
                pos => {
                    const { latitude: lat, longitude: lng, accuracy } = pos.coords;
                    currentPos = { lat, lng, accuracy, timestamp: Date.now() };
                    
                    marker.setLatLng([lat, lng]);
                    map.setView([lat, lng], 16);
                    
                    database.ref(`locations/${sessionIdInput.value}/${user}`).set({
                        userName: user,
                        position: currentPos,
                        expires: Date.now() + 3600000 
                    });

                    if (!isSharingLive) {
                        isSharingLive = true;
                        statusDiv.textContent = "✅ Satelit Terkoneksi!";
                        statusDiv.className = "status success d-block";
                        showShareUI();
                        getLocationBtn.innerHTML = '<i class="fas fa-check-circle me-2"></i>Live Satelit Aktif';
                        getLocationBtn.className = "btn btn-success btn-lg w-100 mb-4";
                    }
                },
                err => { alert("GPS Error: " + err.message); },
                { enableHighAccuracy: true, timeout: 15000, maximumAge: 0 }
            );
        }

        function showShareUI() {
            let path = window.location.pathname;
            if (path.endsWith('index.html')) path = path.replace('index.html', '');
            if (!path.endsWith('/')) path += '/';
            
            const url = `${window.location.origin}${path}viewer.html?session=${sessionIdInput.value}`;
            document.getElementById('shareUrl').textContent = url;
            document.getElementById('qrCode').innerHTML = `<img src="https://api.qrserver.com/v1/create-qr-code/?size=150x150&data=${encodeURIComponent(url)}" style="border: 2px solid #00cfef; border-radius: 10px;">`;
            document.getElementById('shareSection').classList.remove('d-none');
        }

        getLocationBtn.addEventListener('click', startSharing);
        document.getElementById('copyBtn').addEventListener('click', () => {
            navigator.clipboard.writeText(document.getElementById('shareUrl').textContent);
            alert("Link grup tersalin!");
        });

        initMap();
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>📍 Share Lokasi Saya</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link rel="stylesheet" href="./assets/style.css">
</head>
<body>
    <div class="container py-5">
        <div class="row justify-content-center">
            <div class="col-lg-10">
                <div class="card text-center">
                    <h1 class="mb-4"><i class="fas fa-map-marker-alt me-3"></i>Share Lokasi Saya</h1>
                    <p class="lead mb-4">Bagikan lokasi real-time legal untuk teman/keluarga</p>
                    
                    <div class="row">
                        <div class="col-md-6 mb-4">
                            <label class="form-label fw-bold"><i class="fas fa-hashtag me-2"></i>Session ID (Nama Grup)</label>
                            <input type="text" id="sessionId" class="form-control form-control-lg" placeholder="contoh: keluarga123" maxlength="20" value="keluargaku">
                        </div>
                    </div>
                    
                    <button id="getLocationBtn" class="btn btn-primary-custom btn-lg mb-4">
                        <i class="fas fa-location-arrow me-2"></i>Mulai Share Lokasi
                    </button>
                    
                    <div id="status" class="status d-none"></div>
                    <div id="map" class="mb-4"></div>
                    
                    <div id="shareSection" class="d-none">
                        <h3 class="mb-3"><i class="fas fa-share-alt me-2 text-primary"></i>Bagikan ke Teman</h3>
                        <div id="qrCode" class="mb-4 d-flex justify-content-center"></div>
                        <div class="share-link mb-3">
                            <label class="fw-bold d-block mb-2">Link Share:</label>
                            <span id="shareUrl" class="text-break"></span>
                        </div>
                        <button id="copyBtn" class="btn btn-outline-success me-2"><i class="fas fa-copy"></i> Copy Link</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/qrcode@1.5.3/build/qrcode.min.js"></script>
    
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

    <script>
        // Konfigurasi Firebase Anda
        const firebaseConfig = {
            apiKey: "AIzaSyDGTvoDJRKbDA9tslkAX3l6QNz0jFmOPXo",
            authDomain: "share-lokasi-app.firebaseapp.com",
            databaseURL: "https://share-lokasi-app-default-rtdb.asia-southeast1.firebasedatabase.app",
            projectId: "share-lokasi-app",
            storageBucket: "share-lokasi-app.firebasestorage.app",
            messagingSenderId: "639805343280",
            appId: "1:639805343280:web:13c6e1cc94d480002b8ff5"
        };
        
        if (!firebase.apps.length) {
            firebase.initializeApp(firebaseConfig);
        }
        const database = firebase.database();

        let map, marker, currentPos = null;
        let shareUrl = '';
        let intervalId;

        const sessionIdInput = document.getElementById('sessionId');
        const getLocationBtn = document.getElementById('getLocationBtn');
        const statusDiv = document.getElementById('status');
        const shareSection = document.getElementById('shareSection');
        const shareUrlSpan = document.getElementById('shareUrl');
        const copyBtn = document.getElementById('copyBtn');
        const qrCodeDiv = document.getElementById('qrCode');

        function initMap(lat = -6.2088, lng = 106.8456) { 
            map = L.map('map').setView([lat, lng], 15);
            L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);
            marker = L.marker([lat, lng]).addTo(map).bindPopup('<b>Lokasi Anda</b><br>Menyambung...').openPopup();
        }

        function updateStatus(message, type = 'info') {
            statusDiv.textContent = message;
            statusDiv.className = `status ${type} d-block`;
            setTimeout(() => statusDiv.classList.add('d-none'), 5000); 
        }

        function getLocation() {
            if (!navigator.geolocation) {
                updateStatus('Geolocation tidak didukung browser ini.', 'error');
                return;
            }

            getLocationBtn.disabled = true;
            getLocationBtn.innerHTML = '<span class="spinner-border spinner-border-sm me-2"></span> Mendapatkan lokasi...';

            if (intervalId) navigator.geolocation.clearWatch(intervalId);

            intervalId = navigator.geolocation.watchPosition(
                pos => {
                    const { latitude: lat, longitude: lng, accuracy } = pos.coords;
                    
                    if (accuracy > 3000) {
                        updateStatus(`Akurasi ${Math.round(accuracy)}m rendah. Matikan VPN.`, 'warning');
                    } else {
                        updateStatus(`✅ Berhasil! Mengirim lokasi ke server...`, 'success');
                    }

                    currentPos = { lat, lng, accuracy, timestamp: Date.now() };
                    updateMap();
                    saveToDatabase(); 
                    
                    // FIX: Hanya eksekusi pembuat QR dan Link satu kali saja untuk cegah Crash
                    if (shareSection.classList.contains('d-none')) {
                        updateShareUrl();
                    }
                    
                    getLocationBtn.disabled = false;
                    getLocationBtn.innerHTML = '<i class="fas fa-satellite-dish me-2"></i>Live: Sedang Berbagi Lokasi';
                    getLocationBtn.classList.replace('btn-primary-custom', 'btn-success');
                },
                err => {
                    // Abaikan error sementara jika aplikasi sudah berjalan lancar
                    if (shareSection.classList.contains('d-none')) {
                        updateStatus('Error: ' + err.message, 'error');
                        getLocationBtn.disabled = false;
                        getLocationBtn.innerHTML = '<i class="fas fa-location-arrow me-2"></i>Coba Lagi';
                    }
                },
                { enableHighAccuracy: true, timeout: 15000, maximumAge: 0 }
            );
        }

        function updateMap() {
            if (!currentPos) return;
            marker.setLatLng([currentPos.lat, currentPos.lng]);
            map.setView([currentPos.lat, currentPos.lng], 16);
        }

        function saveToDatabase() {
            if (!currentPos || !sessionIdInput.value) return;
            database.ref('locations/' + sessionIdInput.value).set({
                position: currentPos,
                expires: Date.now() + 3600000 
            }).catch((error) => {
                console.error("Firebase Error:", error);
            });
        }

        function updateShareUrl() {
            const session = sessionIdInput.value.trim();
            if (!session || !currentPos) return;
            
            // FIX: Pembuat URL dinamis yang lebih kuat anti-gagal
            let basePath = window.location.pathname;
            if (basePath.endsWith('index.html')) basePath = basePath.replace('index.html', '');
            if (!basePath.endsWith('/')) basePath += '/';
            
            shareUrl = `${window.location.origin}${basePath}viewer.html?session=${session}`;
            shareUrlSpan.textContent = shareUrl;
            
            // FIX: Bersihkan kontainer sebelum membuat QR agar RAM tidak bocor
            qrCodeDiv.innerHTML = '';
            QRCode.toCanvas(qrCodeDiv, shareUrl, { width: 200, margin: 1 });
            
            shareSection.classList.remove('d-none');
        }

        getLocationBtn.addEventListener('click', getLocation);
        copyBtn.addEventListener('click', () => {
            navigator.clipboard.writeText(shareUrl).then(() => {
                copyBtn.innerHTML = '<i class="fas fa-check"></i> Tersalin!';
                setTimeout(() => copyBtn.innerHTML = '<i class="fas fa-copy"></i> Copy Link', 2000);
            });
        });
        
        // Reset link jika nama grup diubah
        sessionIdInput.addEventListener('input', () => {
            shareSection.classList.add('d-none');
            getLocationBtn.innerHTML = '<i class="fas fa-location-arrow me-2"></i>Update Sesi Baru';
            getLocationBtn.classList.replace('btn-success', 'btn-primary-custom');
        });

        initMap();
    </script>
</body>
</html>

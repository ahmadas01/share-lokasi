<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>📍 Live Satelit Group - Ahmad Edition</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        body { background-color: #1a1a1a; color: #fff; font-family: 'Segoe UI', sans-serif; }
        .card { background: #2d2d2d; border: none; box-shadow: 0 10px 30px rgba(0,0,0,0.5); border-radius: 20px; padding: 25px; }
        .form-control { background: #3d3d3d; border: 1px solid #444; color: #fff; }
        .form-control:focus { background: #444; color: #fff; border-color: #4a6ee0; box-shadow: none; }
        
        /* Preview Foto Profil Lingkaran */
        .photo-preview-container { width: 110px; height: 110px; border-radius: 50%; border: 3px solid #4a6ee0; overflow: hidden; margin: 0 auto 15px auto; background: #3d3d3d; display: flex; align-items: center; justify-content: center; cursor: pointer; transition: 0.3s; }
        .photo-preview-container img { width: 100%; height: 100%; object-fit: cover; display: none; }
        .photo-preview-container i { font-size: 2.5rem; color: #666; }
        .photo-preview-container:hover { transform: scale(1.05); border-color: #00cfef; }
        #fileInput { display: none; }

        .btn-primary-custom { background: linear-gradient(135deg, #4a6ee0, #2e4cad); border: none; font-weight: 600; padding: 15px; }
        #map { height: 250px; width: 100%; border-radius: 15px; margin-bottom: 20px; border: 2px solid #444; z-index: 1; }
        .status { padding: 12px; border-radius: 10px; margin-bottom: 20px; font-weight: 600; font-size: 0.9rem; }
        .status.success { background: #1b4332; color: #75ec9c; }
        .status.loading { background: #0a4275; color: #fff; }
    </style>
</head>
<body>
    <div class="container py-4">
        <div class="row justify-content-center">
            <div class="col-lg-6 col-md-8">
                <div class="card text-center">
                    <h3 class="mb-4"><i class="fas fa-satellite-dish text-info me-2"></i>Tracking Grup Satelit</h3>
                    
                    <input type="file" id="fileInput" accept="image/*">
                    <div class="photo-preview-container" onclick="document.getElementById('fileInput').click()">
                        <i class="fas fa-user-plus" id="cameraIcon"></i>
                        <img id="photoPreview" alt="Preview">
                    </div>
                    <p class="small text-info mb-4">Klik foto untuk upload profil</p>

                    <div class="text-start mb-3">
                        <label class="form-label fw-bold small text-muted">Nama Anda</label>
                        <input type="text" id="userName" class="form-control form-control-lg" placeholder="Contoh: Ahmad" maxlength="15">
                    </div>

                    <div class="text-start mb-4">
                        <label class="form-label fw-bold small text-muted">Nama Grup (Session ID)</label>
                        <input type="text" id="sessionId" class="form-control form-control-lg" placeholder="mis: keluargaku" value="keluargaku">
                    </div>
                    
                    <button id="getLocationBtn" class="btn btn-primary-custom btn-lg w-100 mb-4">
                        <i class="fas fa-play me-2"></i>Aktifkan Share Lokasi
                    </button>
                    
                    <div id="status" class="status d-none"></div>
                    <div id="map"></div>
                    
                    <div id="shareSection" class="d-none mt-4 text-center">
                        <hr style="border-color:#444">
                        <h6 class="text-info mb-3">Link Monitoring (Bagikan ke Grup)</h6>
                        <div id="qrCode" class="mb-3 d-flex justify-content-center"></div>
                        <button id="copyBtn" class="btn btn-sm btn-outline-info w-100"><i class="fas fa-copy me-2"></i>Salin Link Grup</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

    <script>
        // API KEY IMGBB MAS AHMAD
        const IMGBB_API_KEY = "ca0b8160f91ffd10388a206d0289cf3c";

        const firebaseConfig = {
            apiKey: "AIzaSyDGTvoDJRKbDA9tslkAX3l6QNz0jFmOPXo",
            authDomain: "share-lokasi-app.firebaseapp.com",
            databaseURL: "https://share-lokasi-app-default-rtdb.asia-southeast1.firebasedatabase.app",
            projectId: "share-lokasi-app",
            storageBucket: "share-lokasi-app.firebasestorage.app",
            messagingSenderId: "639805343280",
            appId: "1:639805343280:web:13c6e1cc94d480002b8ff5"
        };
        
        firebase.initializeApp(firebaseConfig);
        const database = firebase.database();

        let map, marker, currentPos = null;
        let isSharingLive = false; 
        let selectedFile, userPhotoURL = null;

        // Logic Preview Foto
        document.getElementById('fileInput').addEventListener('change', function(e) {
            selectedFile = e.target.files[0];
            if (selectedFile) {
                const reader = new FileReader();
                reader.onload = e => {
                    document.getElementById('photoPreview').src = e.target.result;
                    document.getElementById('photoPreview').style.display = 'block';
                    document.getElementById('cameraIcon').style.display = 'none';
                }
                reader.readAsDataURL(selectedFile);
            }
        });

        function initMap() {
            map = L.map('map', {attributionControl: false}).setView([-6.2088, 106.8456], 15);
            L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}').addTo(map);
            marker = L.marker([-6.2088, 106.8456]).addTo(map);
        }

        async function handleStartSharing() {
            const user = document.getElementById('userName').value.trim();
            const session = document.getElementById('sessionId').value.trim();
            if (!user || !session || !selectedFile) { alert("Nama, Grup, dan Foto wajib diisi!"); return; }

            const btn = document.getElementById('getLocationBtn');
            btn.disabled = true;
            btn.innerHTML = '<i class="fas fa-cloud-upload-alt fa-spin me-2"></i>Mengirim Foto...';

            try {
                // UPLOAD KE IMGBB (Gratis)
                const formData = new FormData();
                formData.append("image", selectedFile);
                
                const response = await fetch(`https://api.imgbb.com/1/upload?key=${IMGBB_API_KEY}`, {
                    method: "POST",
                    body: formData
                });
                const result = await response.json();
                
                if (result.success) {
                    userPhotoURL = result.data.url;
                    btn.innerHTML = '<i class="fas fa-satellite fa-spin me-2"></i>Mencari GPS...';
                    startGpsTracking(user, session);
                } else {
                    throw new Error("Gagal upload foto ke ImgBB.");
                }
            } catch (error) {
                alert(error.message);
                btn.disabled = false;
                btn.innerHTML = 'Coba Lagi';
            }
        }

        function startGpsTracking(user, session) {
            navigator.geolocation.watchPosition(
                pos => {
                    const { latitude: lat, longitude: lng, accuracy } = pos.coords;
                    currentPos = { lat, lng, accuracy, timestamp: Date.now() };
                    
                    marker.setLatLng([lat, lng]);
                    map.setView([lat, lng], 16);
                    
                    // Update Firebase
                    database.ref(`locations/${session}/${user}`).set({
                        userName: user,
                        photoURL: userPhotoURL,
                        position: currentPos,
                        expires: Date.now() + 3600000 
                    });

                    if (!isSharingLive) {
                        isSharingLive = true;
                        document.getElementById('status').textContent = "✅ Satelit Aktif! Lokasi Terkirim.";
                        document.getElementById('status').className = "status success d-block";
                        showShareUI(session);
                        const btn = document.getElementById('getLocationBtn');
                        btn.innerHTML = '<i class="fas fa-broadcast-tower me-2"></i>Sedang Live...';
                        btn.className = "btn btn-success btn-lg w-100 mb-4";
                    }
                },
                err => { alert("GPS Error: " + err.message); },
                { enableHighAccuracy: true, timeout: 15000, maximumAge: 0 }
            );
        }

        function showShareUI(session) {
            let path = window.location.pathname.replace('index.html', '');
            if (!path.endsWith('/')) path += '/';
            const url = `${window.location.origin}${path}viewer.html?session=${session}`;
            document.getElementById('qrCode').innerHTML = `<img src="https://api.qrserver.com/v1/create-qr-code/?size=150x150&data=${encodeURIComponent(url)}" style="border: 2px solid #00cfef; border-radius: 10px;">`;
            document.getElementById('shareSection').classList.remove('d-none');
            window.finalUrl = url;
        }

        document.getElementById('getLocationBtn').addEventListener('click', handleStartSharing);
        document.getElementById('copyBtn').addEventListener('click', () => {
            navigator.clipboard.writeText(window.finalUrl);
            alert("Link grup disalin!");
        });

        initMap();
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>📍 Share Lokasi Saya</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link rel="stylesheet" href="./assets/style.css">
</head>
<body>
    <div class="container py-5">
        <div class="row justify-content-center">
            <div class="col-lg-10">
                <div class="card text-center">
                    <h1 class="mb-4"><i class="fas fa-map-marker-alt me-3"></i>Share Lokasi Saya</h1>
                    <p class="lead mb-4">Bagikan lokasi real-time legal untuk teman/keluarga</p>
                    
                    <div class="row">
                        <div class="col-md-6 mb-4">
                            <label class="form-label fw-bold"><i class="fas fa-hashtag me-2"></i>Session ID (Nama Grup)</label>
                            <input type="text" id="sessionId" class="form-control form-control-lg" placeholder="contoh: keluarga123" maxlength="20" value="keluarga123">
                        </div>
                    </div>
                    
                    <button id="getLocationBtn" class="btn btn-primary-custom btn-lg mb-4">
                        <i class="fas fa-location-arrow me-2"></i>Mulai Share Lokasi
                    </button>
                    
                    <div id="status" class="status d-none"></div>
                    
                    <div id="map" class="mb-4"></div>
                    
                    <div id="shareSection" class="d-none">
                        <h3 class="mb-3"><i class="fas fa-share-alt me-2 text-primary"></i>Bagikan ke Teman</h3>
                        
                        <div id="qrCode" class="mb-4"></div>
                        
                        <div class="share-link mb-3">
                            <label class="fw-bold d-block mb-2">Link Share:</label>
                            <span id="shareUrl"></span>
                        </div>
                        
                        <button id="copyBtn" class="btn btn-outline-success me-2"><i class="fas fa-copy"></i> Copy Link</button>
                        <button id="refreshBtn" class="btn btn-warning"><span class="loading d-none"></span> Refresh Lokasi</button>
                    </div>
                    
                    <div id="info" class="mt-4 small text-muted">
                        <p><i class="fas fa-info-circle"></i> Lokasi update otomatis. Tutup tab untuk stop sharing.</p>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/qrcode@1.5.3/build/qrcode.min.js"></script>
    <script>
        let map, marker, currentPos = null;
        let shareUrl = '';
        let intervalId;

        const sessionIdInput = document.getElementById('sessionId');
        const getLocationBtn = document.getElementById('getLocationBtn');
        const statusDiv = document.getElementById('status');
        const shareSection = document.getElementById('shareSection');
        const shareUrlSpan = document.getElementById('shareUrl');
        const copyBtn = document.getElementById('copyBtn');
        const refreshBtn = document.getElementById('refreshBtn');
        const qrCodeDiv = document.getElementById('qrCode');

        // Init map
        function initMap(lat = -6.2088, lng = 106.8456) { // Default: Jakarta
            map = L.map('map').setView([lat, lng], 15);
            L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
                attribution: '© OpenStreetMap'
            }).addTo(map);
            marker = L.marker([lat, lng]).addTo(map)
                .bindPopup('<b>Lokasi Anda</b><br>Menyambung...').openPopup();
        }

        function updateStatus(message, type = 'info') {
            statusDiv.textContent = message;
            statusDiv.className = `status ${type} d-block`;
            // Biarkan pesan sukses/warning tampil lebih lama agar terbaca
            setTimeout(() => statusDiv.classList.add('d-none'), 8000); 
        }

        function getLocation() {
            if (!navigator.geolocation) {
                updateStatus('Geolocation tidak didukung browser ini.', 'error');
                return;
            }

            getLocationBtn.disabled = true;
            getLocationBtn.innerHTML = '<span class="loading"></span> Mendapatkan lokasi...';

            if (intervalId) {
                navigator.geolocation.clearWatch(intervalId);
            }

            intervalId = navigator.geolocation.watchPosition(
                pos => {
                    const { latitude: lat, longitude: lng, accuracy } = pos.coords;
                    
                    // Modifikasi: Angka akurasi dinaikkan ke 3000 agar lolos pengecekan VPN/Desktop
                    if (accuracy > 3000) {
                        updateStatus(`Akurasi ${Math.round(accuracy)}m sangat rendah. Matikan VPN untuk hasil akurat.`, 'warning');
                        // return; -> Dihapus agar peta tetap muncul walaupun meleset
                    } else {
                        updateStatus(`✅ Lokasi didapat! Akurasi: ${Math.round(accuracy)}m`, 'success');
                    }

                    currentPos = { lat, lng, accuracy, timestamp: Date.now() };
                    updateMap();
                    saveToStorage();
                    updateShareUrl();
                    
                    // Kembalikan tombol ke semula dengan status berjalan
                    getLocationBtn.disabled = false;
                    getLocationBtn.innerHTML = '<i class="fas fa-location-arrow me-2"></i>Status: Berbagi Lokasi...';
                    refreshBtn.querySelector('.loading')?.classList.add('d-none');
                },
                err => {
                    let msg = '';
                    switch(err.code) {
                        case 1: msg = 'Izin lokasi ditolak. Izinkan di pengaturan browser.'; break;
                        case 2: msg = 'Tidak bisa deteksi lokasi. Aktifkan GPS atau pindah ke luar ruangan.'; break;
                        case 3: msg = 'Pencarian lokasi terlalu lama (Timeout). Sinyal GPS lemah.'; break;
                        default: msg = 'Error: ' + err.message;
                    }
                    updateStatus(msg, 'error');
                    
                    getLocationBtn.disabled = false;
                    getLocationBtn.innerHTML = '<i class="fas fa-location-arrow me-2"></i>Coba Lagi';
                    refreshBtn.querySelector('.loading')?.classList.add('d-none');
                },
                { enableHighAccuracy: true, timeout: 15000, maximumAge: 0 }
            );
        }

        function updateMap() {
            if (!currentPos) return;
            marker.setLatLng([currentPos.lat, currentPos.lng]);
            map.setView([currentPos.lat, currentPos.lng], 16);
            marker.bindPopup(`<b>Lokasi Anda</b><br>
                Lat: ${currentPos.lat.toFixed(6)}<br>
                Lng: ${currentPos.lng.toFixed(6)}<br>
                Akurasi: ${currentPos.accuracy.toFixed(0)}m<br>
                Update: ${new Date(currentPos.timestamp).toLocaleTimeString('id-ID')}`).openPopup();
        }

        function saveToStorage() {
            if (!currentPos || !sessionIdInput.value) return;
            const data = JSON.stringify({
                session: sessionIdInput.value,
                position: currentPos,
                expires: Date.now() + 3600000 // 1 jam
            });
            localStorage.setItem('locshare_' + sessionIdInput.value, data);
        }

        function updateShareUrl() {
            const session = sessionIdInput.value.trim();
            if (!session || !currentPos) return;
            
            shareUrl = `${window.location.origin}${window.location.pathname.replace('index.html', 'viewer.html')}?session=${session}`;
            shareUrlSpan.textContent = shareUrl;
            
            // Generate QR
            QRCode.toCanvas(qrCodeDiv, shareUrl, { width: 200, margin: 1 }, 
                (error) => { if (error) console.error(error); });
            
            shareSection.classList.remove('d-none');
        }

        // Event listeners
        getLocationBtn.addEventListener('click', getLocation);

        copyBtn.addEventListener('click', () => {
            navigator.clipboard.writeText(shareUrl).then(() => {
                const orig = copyBtn.innerHTML;
                copyBtn.innerHTML = '<i class="fas fa-check"></i> Tersalin!';
                copyBtn.classList.remove('btn-outline-success');
                copyBtn.classList.add('btn-success');
                setTimeout(() => {
                    copyBtn.innerHTML = orig;
                    copyBtn.classList.remove('btn-success');
                    copyBtn.classList.add('btn-outline-success');
                }, 2000);
            });
        });

        refreshBtn.addEventListener('click', () => {
            refreshBtn.querySelector('.loading')?.classList.remove('d-none');
            getLocation();
        });

        sessionIdInput.addEventListener('input', () => {
            if (shareSection.classList.contains('d-none')) return;
            updateShareUrl();
        });

        // Init
        initMap();
        updateStatus('Siap! Klik tombol untuk mulai share lokasi.', 'info');
    </script>
</body>
</html>

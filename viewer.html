<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>👁️ Pantau Grup Tracking</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        body { background-color: #f0f2f5; }
        #map { height: 80vh; width: 100%; border-radius: 0 0 20px 20px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        .monitor-card { background: white; border-radius: 20px; overflow: hidden; border: none; }
        .header-box { padding: 20px; background: white; border-bottom: 1px solid #eee; }
        .badge-live { background: #ff4757; color: white; padding: 5px 12px; border-radius: 50px; font-size: 0.75rem; animation: blink 1.5s infinite; }
        @keyframes blink { 0% { opacity: 1; } 50% { opacity: 0.5; } 100% { opacity: 1; } }
    </style>
</head>
<body>
    <div class="container py-4">
        <div class="monitor-card">
            <div class="header-box d-flex justify-content-between align-items-center">
                <div>
                    <h4 class="mb-0"><i class="fas fa-map-marked-alt text-primary me-2"></i>Monitor Grup</h4>
                    <small class="text-muted">Grup: <span id="sessId" class="fw-bold">...</span></small>
                </div>
                <div id="userCount" class="badge-live d-none">0 Orang Live</div>
            </div>
            <div id="map"></div>
        </div>
        <div class="text-center mt-3">
            <a href="index.html" class="btn btn-sm btn-outline-secondary"><i class="fas fa-plus me-1"></i>Gabung Grup</a>
        </div>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyDGTvoDJRKbDA9tslkAX3l6QNz0jFmOPXo",
            authDomain: "share-lokasi-app.firebaseapp.com",
            databaseURL: "https://share-lokasi-app-default-rtdb.asia-southeast1.firebasedatabase.app",
            projectId: "share-lokasi-app",
            storageBucket: "share-lokasi-app.firebasestorage.app",
            messagingSenderId: "639805343280",
            appId: "1:639805343280:web:13c6e1cc94d480002b8ff5"
        };
        
        firebase.initializeApp(firebaseConfig);
        const database = firebase.database();

        let map;
        let markers = {}; 
        const urlParams = new URLSearchParams(window.location.search);
        const sessionId = urlParams.get('session');

        if (sessionId) {
            document.getElementById('sessId').textContent = sessionId;
            initMap();
            listenToGroup();
        }

        function initMap() {
            map = L.map('map').setView([-2.5489, 118.0149], 5);
            L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);
        }

        function listenToGroup() {
            const groupRef = database.ref('locations/' + sessionId);
            
            groupRef.on('value', (snapshot) => {
                const users = snapshot.val();
                if (!users) return;

                let bounds = L.latLngBounds();
                let activeCount = 0;

                for (let name in users) {
                    const data = users[name];
                    const pos = data.position;

                    // Lewati data jika sudah basi (lebih dari 1 jam tidak update)
                    if (Date.now() > data.expires) {
                        if (markers[name]) { map.removeLayer(markers[name]); delete markers[name]; }
                        continue;
                    }

                    activeCount++;
                    const latlng = [pos.lat, pos.lng];
                    bounds.extend(latlng);

                    if (markers[name]) {
                        markers[name].setLatLng(latlng);
                    } else {
                        // Marker dengan nama user di atasnya
                        markers[name] = L.marker(latlng).addTo(map)
                            .bindTooltip(name, { permanent: true, direction: 'top', className: 'fw-bold' })
                            .openTooltip();
                    }
                }

                // FITUR AUTO-ZOOM: Peta otomatis menyesuaikan posisi semua orang
                if (activeCount > 0) {
                    map.fitBounds(bounds, { padding: [50, 50], maxZoom: 16 });
                    document.getElementById('userCount').textContent = `${activeCount} Orang Live`;
                    document.getElementById('userCount').classList.remove('d-none');
                }
            });
        }
    </script>
</body>
</html>

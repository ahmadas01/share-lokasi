<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>👁️ Pantau Grup - Mode Satelit</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        body { background-color: #000; margin: 0; padding: 0; }
        #map { height: 100vh; width: 100vw; }
        .overlay-info { position: absolute; top: 15px; left: 15px; z-index: 1000; background: rgba(0,0,0,0.8); padding: 15px; border-radius: 15px; color: #fff; border: 1px solid #444; min-width: 200px; }
        .badge-live { background: #ff0000; color: #fff; padding: 4px 10px; border-radius: 5px; font-size: 10px; letter-spacing: 1px; animation: blink 1s infinite; }
        @keyframes blink { 0% { opacity: 1; } 50% { opacity: 0.3; } 100% { opacity: 1; } }
        .gmaps-btn { background: #4285F4; color: #fff; border: none; padding: 8px 12px; border-radius: 5px; font-size: 12px; font-weight: bold; margin-top: 10px; display: block; text-decoration: none; text-align: center; }
        .gmaps-btn:hover { background: #3367d6; color: white; }
    </style>
</head>
<body>
    <div class="overlay-info">
        <h6 class="mb-1"><i class="fas fa-globe-asia text-info me-2"></i>Monitor Satelit</h6>
        <div class="small text-muted mb-2">Grup: <span id="sessId" class="text-white">...</span></div>
        <div id="userCount" class="badge-live d-none">MENCARI ANGGOTA...</div>
    </div>

    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyDGTvoDJRKbDA9tslkAX3l6QNz0jFmOPXo",
            authDomain: "share-lokasi-app.firebaseapp.com",
            databaseURL: "https://share-lokasi-app-default-rtdb.asia-southeast1.firebasedatabase.app",
            projectId: "share-lokasi-app",
            storageBucket: "share-lokasi-app.firebasestorage.app",
            messagingSenderId: "639805343280",
            appId: "1:639805343280:web:13c6e1cc94d480002b8ff5"
        };
        
        firebase.initializeApp(firebaseConfig);
        const database = firebase.database();

        let map, markers = {}; 
        const urlParams = new URLSearchParams(window.location.search);
        const sessionId = urlParams.get('session');

        if (sessionId) {
            document.getElementById('sessId').textContent = sessionId;
            initMap();
            listenToGroup();
        }

        function initMap() {
            map = L.map('map', { zoomControl: false }).setView([-2.5489, 118.0149], 5);
            L.control.zoom({ position: 'bottomright' }).addTo(map);

            // MODE SATELIT REAL-TIME
            L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', {
                attribution: 'Esri World Imagery'
            }).addTo(map);
        }

        function listenToGroup() {
            const groupRef = database.ref('locations/' + sessionId);
            
            groupRef.on('value', (snapshot) => {
                const users = snapshot.val();
                if (!users) return;

                let bounds = L.latLngBounds();
                let activeCount = 0;

                for (let name in users) {
                    const data = users[name];
                    const pos = data.position;

                    if (Date.now() > data.expires) {
                        if (markers[name]) { map.removeLayer(markers[name]); delete markers[name]; }
                        continue;
                    }

                    activeCount++;
                    const latlng = [pos.lat, pos.lng];
                    bounds.extend(latlng);

                    // Link Google Maps untuk Redirect
                    const gMapsLink = `https://www.google.com/maps/dir/?api=1&destination=${pos.lat},${pos.lng}`;

                    if (markers[name]) {
                        markers[name].setLatLng(latlng);
                        markers[name].getPopup().setContent(`
                            <div style="color:#333">
                                <b>Anggota: ${name}</b><br>
                                <small>Akurasi: ${pos.accuracy.toFixed(0)}m</small><br>
                                <a href="${gMapsLink}" target="_blank" class="gmaps-btn">
                                    <i class="fas fa-directions me-1"></i>Buka Rute Google Maps
                                </a>
                            </div>
                        `);
                    } else {
                        markers[name] = L.marker(latlng).addTo(map)
                            .bindTooltip(name, { permanent: true, direction: 'top', className: 'fw-bold' })
                            .bindPopup(`
                                <div style="color:#333">
                                    <b>Anggota: ${name}</b><br>
                                    <small>Akurasi: ${pos.accuracy.toFixed(0)}m</small><br>
                                    <a href="${gMapsLink}" target="_blank" class="gmaps-btn">
                                        <i class="fas fa-directions me-1"></i>Buka Rute Google Maps
                                    </a>
                                </div>
                            `).openPopup();
                    }
                }

                if (activeCount > 0) {
                    map.fitBounds(bounds, { padding: [80, 80], maxZoom: 17 });
                    document.getElementById('userCount').textContent = `${activeCount} ANGGOTA ONLINE`;
                    document.getElementById('userCount').classList.remove('d-none');
                }
            });
        }
    </script>
</body>
</html>
